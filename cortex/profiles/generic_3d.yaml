# Example profile for a first-person 3D game, with key bindings, tips and a reflex filled in.
# The app writes a simple profile for you when you pick a game window; copy parts of this one
# into it (Settings > Games folder) to tell the AI your game's controls.

engine: agent

game:
  window_owner: "Your 3D Game"     # the app name shown in the menu bar while the game is focused
  description: >
    A first-person 3D game. WASD moves, the mouse looks around, left click
    attacks/uses, right click aims/places, number keys pick items.

agent:
  model: claude-opus-5-5
  effort: low                      # low = faster turns; medium/high = more careful play
  max_steps: 150                   # Claude turns before stopping
  max_cost_usd: 3.00               # stop when the estimated API cost reaches this
  screenshot_width: 1280           # screenshots are downscaled to this width before sending
  look_px_per_degree: 6            # mouse movement per degree of camera turn; tune for your sensitivity
  keys:                            # what each action is called -> key on the keyboard (or mouse button)
    forward: w
    back: s
    left: a
    right: d
    jump: space
    sprint: shift
    sneak: ctrl
    inventory: e
    drop: q
    attack: mouse_left
    use: mouse_right
  tips:
    - Hold a mouse button (click with hold_seconds) for actions that take time, like mining or charging.
    - Look down (positive down_degrees) to interact with things at your feet.

# Instant local reactions, checked many times a second with CLIP (no Claude round-trip).
reflexes:
  - name: low_health
    roi: [0.30, 0.82, 0.50, 0.90]  # x0, y0, x1, y1 as fractions of the window
    prompt: "a nearly empty red health bar"
    otherwise: "a full red health bar"
    threshold: 0.75
    keys: [s]                      # back off
    cooldown_s: 3

controls:
  kill_switch: f12
  pause: f11

loop:
  pause_when_unfocused: true
