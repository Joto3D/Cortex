[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.3.0"
description = "A Mac app that plays single-player games for you: free Gemini AI plus fast local vision (CLIP) and teach-by-showing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
clip = ["torch>=2.2", "open_clip_torch>=2.26"]
ai = ["anthropic>=1.0"]
mac = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "mss>=9.0",
    "pynput>=1.7",
]
debug = ["opencv-python>=4.8"]
app = ["cortex[clip,ai,mac]", "pywebview>=5.4", "pyobjc-framework-WebKit>=10.0", "keyring>=24", "certifi"]
build = ["cortex[app]", "pyinstaller>=6.6"]
dev = ["pytest>=8.0"]
all = ["cortex[clip,ai,mac,app,debug,dev]"]

[project.scripts]
cortex = "cortex.loop:main"
cortex-games = "cortex.games:main"

[project.gui-scripts]
cortex-app = "cortex.app.main:main"

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.setuptools.package-data]
cortex = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
